name: Credential-free Studio Assistant UI probe (local fixture only)
on:
  push:
    branches:
      - feature/studio-openai-tunnel-assisted
    paths:
      - ci/assisted/assistant-offline-trigger.txt
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assistant-offline:
    runs-on: windows-2022
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install official Roblox Studio without credentials
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./ci/assisted/install-windows.ps1
      - name: Install safe accessibility and hover dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet 'pywinauto==0.6.9' 'psutil>=6.1,<8'
          if ($LASTEXITCODE -ne 0) { throw 'Read-only UIA dependencies missing.' }
      - name: Open local pinned Roblox-owned Baseplate without uploading
        shell: pwsh
        run: ./ci/assisted/open-test-place-cli.ps1 -LaunchOnly
      - name: Probe Assistant accessibility and tooltip without clicking or screenshots
        shell: pwsh
        run: |
          python .\ci\assisted\probe-assistant-ui.py
          if ($LASTEXITCODE -ne 0) { throw 'Read-only Assistant probe encountered an error.' }
