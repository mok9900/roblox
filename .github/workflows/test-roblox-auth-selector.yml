name: Roblox 2FA menu-selector unit tests
on:
  push:
    branches:
      - feature/studio-openai-tunnel-assisted
    paths:
      - ci/assisted/login-ui.py
      - ci/assisted/native-studio-login.py
      - ci/assisted/visual-browser-login.py
      - ci/assisted/visual_twofactor.py
      - ci/assisted/probe-editor-cli.py
      - ci/assisted/activate-mcp-ui.py
      - ci/assisted/assistant_visual.py
      - ci/assisted/session.ps1
      - ci/assisted/session-persistent.ps1
      - .github/workflows/studio-openai-tunnel-persistent.yml
      - ci/assisted/configure-edge.ps1
      - ci/assisted/check-studio-auth-protocol.ps1
      - ci/assisted/tests/test_email_method.py
      - ci/assisted/tests/test_visual_twofactor.py
      - ci/assisted/tests/test_assistant_visual.py
      - ci/assisted/tests/test_persistent_session_contract.py
      - ci/assisted/tests/ocr_runtime_smoke.py
      - .github/workflows/test-roblox-auth-selector.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selector-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python GUI login selector
        run: python -m py_compile ci/assisted/login-ui.py ci/assisted/native-studio-login.py ci/assisted/visual-browser-login.py ci/assisted/probe-editor-cli.py ci/assisted/activate-mcp-ui.py ci/assisted/assistant_visual.py
      - name: Test email and guarded DXGI/WGC OCR-to-SendInput targeting
        run: python -m unittest discover -s ci/assisted/tests -p 'test_*.py' -v

  powershell-static-parse:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse unattended GUI session PowerShell without execution
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          $paths = @('.\\ci\\assisted\\session.ps1', '.\\ci\\assisted\\session-persistent.ps1', '.\\ci\\assisted\\configure-edge.ps1', '.\\ci\\assisted\\check-studio-auth-protocol.ps1')
          foreach ($path in $paths) {
            $resolved = (Resolve-Path $path).Path
            [System.Management.Automation.Language.Parser]::ParseFile($resolved, [ref]$tokens, [ref]$parseErrors) | Out-Null
          }
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            throw 'SESSION_PS1_SYNTAX_INVALID'
          }
          Write-Host 'SESSION_AND_EDGE_PS1_SYNTAX_VERIFIED'
      - name: Apply and validate narrow temporary Edge Studio callback policy
        shell: pwsh
        run: ./ci/assisted/configure-edge.ps1
  
  assistant-ocr-runtime:
    name: Windows offline Assistant OCR integration (no credentials)
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install same optional local OCR dependencies as authenticated session
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet 'rapidocr==3.10.0' 'onnxruntime>=1.18,<2' 'Pillow>=11,<13'
          if ($LASTEXITCODE -ne 0) { throw 'ASSISTANT_OCR_RUNTIME_INSTALL_FAILED' }
      - name: Verify in-memory synthetic Assistant label recognition
        shell: pwsh
        run: |
          python .\\ci\\assisted\\tests\\ocr_runtime_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'ASSISTANT_OCR_RUNTIME_SMOKE_FAILED' }
