name: Roblox MCP - HTTPS bridge regression (no account login)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ci/https-mcp/**'
      - '.github/workflows/roblox-https-mcp-test.yml'
permissions:
  contents: read
jobs:
  test-bridge:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install JWT verification dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check 'PyJWT[crypto]>=2.10.1,<3'
      - name: Exercise loopback HTTP authentication and synthetic stdio fixture
        shell: pwsh
        run: python ci/https-mcp/test_bridge.py
