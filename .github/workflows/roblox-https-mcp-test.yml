name: Roblox MCP - HTTPS bridge regression (no account login)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ci/https-mcp/**'
      - '.github/workflows/roblox-https-mcp-test.yml'
permissions:
  contents: read
jobs:
  test-bridge:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install JWT verification dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check 'PyJWT[crypto]>=2.10.1,<3'
      - name: Exercise loopback HTTP authentication and synthetic stdio fixture
        shell: pwsh
        run: |
          python ci/https-mcp/test_bridge.py
          if ($LASTEXITCODE -ne 0) { throw 'BRIDGE_REGRESSION_FAILED' }
          python ci/https-mcp/test_runner.py
          if ($LASTEXITCODE -ne 0) { throw 'RUNNER_REGRESSION_FAILED' }
          python ci/https-mcp/test_studio_session.py
          if ($LASTEXITCODE -ne 0) { throw 'STUDIO_SESSION_REGRESSION_FAILED' }
          python ci/https-mcp/test_dev_runner.py
          if ($LASTEXITCODE -ne 0) { throw 'DEV_RUNNER_REGRESSION_FAILED' }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated worker relay lifecycle
        shell: pwsh
        run: node --test ci/https-mcp/test_worker.mjs
